<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: JBM; src: url(fonts/JetBrainsMono-Regular.ttf); font-weight: 400; }
@font-face { font-family: JBM; src: url(fonts/JetBrainsMono-Bold.ttf); font-weight: 700; }
@font-face { font-family: NSK; src: url(fonts/NotoSansKR.ttf); font-weight: 100 900; }
html,body{margin:0;background:#0C0C0C}
.c{width:1024px;height:500px;position:relative;overflow:hidden;background:radial-gradient(120% 90% at 80% 0%, var(--glow) 0%, #0C0C0C 60%);font-family:JBM,NSK,monospace;color:#F2F2F2}
.bar{position:absolute;left:0;right:0;top:0;height:56px;background:#1A1A1A;border-bottom:1px solid #2A2A2A;display:flex;align-items:center;gap:14px;padding:0 32px;font-size:22px}
.bar b{font-weight:700}
.bar .d{color:#A3A3A3;font-size:18px;margin-left:8px}
.icon{position:absolute;left:64px;top:118px;width:300px;height:300px;border-radius:64px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 1px #2A2A2A}
.icon img{width:100%;height:100%;display:block}
.t{position:absolute;left:412px;top:130px;right:40px}
.p{font-size:24px;color:#A3A3A3}.p i{font-style:normal;color:var(--acc)}
.n{font-size:76px;font-weight:700;margin-top:6px;letter-spacing:-1px}
.s{font-family:NSK,sans-serif;font-size:34px;font-weight:700;margin-top:10px;line-height:1.3}
.k{font-size:22px;color:#A3A3A3;margin-top:18px}.k span{color:var(--acc)}
.cur{display:inline-block;width:18px;height:30px;background:var(--acc);vertical-align:-4px;margin-left:6px}
</style></head><body><div id="r"></div><script>
const q=new URLSearchParams(location.search), a=q.get('app');
const A={
 todo:{acc:'#16C60C',glow:'#12201a',name:'todo.exe',sub:'할 일도 터미널처럼',cmd:'add 치과 예약 #life !',keys:'add · done · ls · stats'},
 diary:{acc:'#F9F1A5',glow:'#201f12',name:'diary.exe',sub:'하루에 한 줄이면 충분해',cmd:'cat --ago',keys:'1년 전 오늘 · cal · grep'},
 ink:{acc:'#61D6D6',glow:'#12201f',name:'ink.exe',sub:'자정마다 글감 하나, 선착순 20명',cmd:'topic',keys:'창작 · 인용 · 명예의 전당'},
}[a];
document.getElementById('r').innerHTML=`<div class="c" style="--acc:${A.acc};--glow:${A.glow}">
<div class="bar"><b>&gt;_</b><span>${A.name}</span><span class="d">C:\\${a}</span></div>
<div class="icon"><img src="${a}.png"></div>
<div class="t"><div class="p">C:\\${a}&gt; <i>${A.cmd}</i></div><div class="n">${A.name}<span class="cur"></span></div>
<div class="s">${A.sub}</div><div class="k">${A.keys.split(' · ').map(x=>'<span>'+x+'</span>').join(' · ')}</div></div></div>`;
</script></body></html>
