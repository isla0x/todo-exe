name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Prepare platform folders
        run: bash tool/setup_platforms.sh

      - name: Get packages
        run: flutter pub get

      - name: Test
        run: flutter test --reporter github

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: todo-exe-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # APK 가 먼저 나오도록 린트는 마지막에 돌린다.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

  # 위젯 Swift 코드가 컴파일되는지 확인 (Xcode 프로젝트 없이 타입 체크만)
  ios-widget:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Typecheck widget Swift
        run: |
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          if ! out=$(xcrun swiftc -typecheck -parse-as-library -sdk "$SDK" -target arm64-apple-ios17.0 ios_widget/*.swift 2>&1); then
            echo "$out"
            echo "$out" | grep -E "error:" | head -20 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          echo "$out"
          echo "widget swift OK"
